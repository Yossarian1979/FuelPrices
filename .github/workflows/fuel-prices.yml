name: Refresh fuel prices and deploy dashboard

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/update_data.py"
      - ".github/workflows/fuel-prices.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fuel-prices-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh official UK data
        run: python scripts/update_data.py

      - name: Commit updated data when changed
        run: |
          if ! git diff --quiet -- data/prices.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "Refresh official UK fuel price data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
