name: Refresh verified fuel prices

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-uk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch official UK weekly data
        run: python scripts/update_prices.py
      - name: Commit updated dataset when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official UK fuel prices"
            git push
          else
            echo "No data changes."
          fi
